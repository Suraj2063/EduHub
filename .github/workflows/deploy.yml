name: Deploy MERN App (CloudFormation + Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: deploy

env:
  AWS_REGION: us-east-1
  STACK_NAME: mern-production-stack
  TEMPLATE: infra/ec2-instance.yaml

jobs:
  deploy:
    name: Provision & Deploy MERN to EC2
    runs-on: ubuntu-latest
    env:
      SSH_OPTS: -i ec2-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o LogLevel=ERROR

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate CloudFormation Template
        run: aws cloudformation validate-template --template-body file://${{ env.TEMPLATE }}

      - name: Deploy CloudFormation Stack (Amazon Linux 2023, t3.medium, gp2)
        run: |
          # Check stack and instance health; delete stale or terminated stack
          STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].StackStatus" --output text 2>/dev/null || true)
          echo "Current stack status: ${STATUS:-DOES_NOT_EXIST}"

          INSTANCE_STATE=""
          if [ -n "$STATUS" ] && [ "$STATUS" != "None" ]; then
            INSTANCE_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" --output text 2>/dev/null || true)
            if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
              INSTANCE_STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].State.Name" --output text 2>/dev/null || true)
              echo "Existing EC2 instance ($INSTANCE_ID) state: ${INSTANCE_STATE:-unknown}"
            fi
          fi

          if [ "$STATUS" = "ROLLBACK_COMPLETE" ] || [ "$STATUS" = "CREATE_FAILED" ] || [ "$INSTANCE_STATE" = "terminated" ]; then
            echo "🗑️ Deleting stale/terminated stack before re-deploying..."
            aws cloudformation delete-stack --stack-name "$STACK_NAME"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
            echo "✅ Cleaned up old stack."
          fi

          # AMI is resolved by CloudFormation via AWS::SSM::Parameter::Value
          # No need to resolve it here — CF reads the SSM path directly.
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file "$TEMPLATE" \
            --parameter-overrides InstanceType=t3.medium \
            --no-fail-on-empty-changeset || {
              echo "::error::CloudFormation deploy failed! Printing failure reasons:"
              aws cloudformation describe-stack-events \
                --stack-name "$STACK_NAME" \
                --query "StackEvents[?ResourceStatus=='CREATE_FAILED'].[LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
                --output table
              exit 1
            }

      - name: Retrieve Instance Details & Public IP
        id: instance
        run: |
          output() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          INSTANCE_ID=$(output InstanceId)
          KEY_ID=$(output KeyPairId)

          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "Instance $INSTANCE_ID is $STATE"

          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "$INSTANCE_ID"
          fi
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"

          IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
          echo "🌐 EC2 Public IP is: $IP"

      - name: Get SSH Key from AWS SSM Parameter Store
        run: |
          aws ssm get-parameter \
            --name "/ec2/keypair/${{ steps.instance.outputs.key_id }}" \
            --with-decryption \
            --query Parameter.Value \
            --output text > ec2-key.pem
          chmod 600 ec2-key.pem

      - name: Wait for SSH & First-Boot Docker Setup
        env:
          IP: ${{ steps.instance.outputs.ip }}
        run: |
          for i in $(seq 1 30); do
            ssh $SSH_OPTS ec2-user@"$IP" true && break
            echo "Waiting for SSH to be ready ($i/30)..."
            sleep 10
          done

          # Wait for UserData (Docker installation) to finish
          ssh $SSH_OPTS ec2-user@"$IP" 'cloud-init status --wait' || true

      - name: Deploy MERN Docker Containers
        env:
          IP: ${{ steps.instance.outputs.ip }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          ssh $SSH_OPTS ec2-user@"$IP" "MONGO_URI='$MONGO_URI' bash -s" << 'EOF'
            set -e
            if [ ! -d "$HOME/MERN_Project" ]; then
              cd "$HOME"
              git clone "https://github.com/${{ github.repository }}.git" MERN_Project
            fi

            cd "$HOME/MERN_Project"
            git fetch origin main
            git reset --hard origin/main

            if [ -n "$MONGO_URI" ]; then
              echo "MONGO_URI=$MONGO_URI" > .env
              echo "✅ Configured production MONGO_URI in .env"
            fi

            chmod +x aws/deploy.sh
            ./aws/deploy.sh
          EOF

      - name: Show Live Application URL
        run: |
          echo "### 🚀 Live at http://${{ steps.instance.outputs.ip }}" >> "$GITHUB_STEP_SUMMARY"
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs" --output table | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cleanup SSH Key on Runner
        if: always()
        run: rm -f ec2-key.pem
