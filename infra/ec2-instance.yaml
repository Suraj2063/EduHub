AWSTemplateFormatVersion: "2010-09-09"
Description: MERN Stack EC2 Instance - AWS Academy compatible (Ubuntu 24.04, t3.medium)

Parameters:
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large]
    Description: EC2 instance size
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Ubuntu 24.04 LTS AMI ID (resolved dynamically in workflow)

Resources:

  # SSH Key Pair — auto-stored in SSM Parameter Store at /ec2/keypair/<KeyPairId>
  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub "${AWS::StackName}-keypair"
      KeyType: rsa

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} - SSH and HTTP"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP for MERN app

  # ── EC2 Instance ──────────────────────────────────────────────────────────────
  #   NOTE: No BlockDeviceMappings — AWS Academy lab_policy denies ec2:RunInstances
  #   on volume/* resources. The AMI's default root volume is used as-is.
  #   Ubuntu 24.04 AMIs default to 8GB which is fine for Docker builds.
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPair
      SecurityGroupIds:
        - !GetAtt SecurityGroup.GroupId
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > /var/log/userdata.log 2>&1
          echo "=== UserData bootstrap started at $(date) ==="
          apt-get update -y
          apt-get install -y ca-certificates curl gnupg git lsb-release
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
            | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -y
          apt-get install -y \
            docker-ce docker-ce-cli containerd.io \
            docker-buildx-plugin docker-compose-plugin
          systemctl enable docker
          systemctl start docker
          usermod -aG docker ubuntu
          echo "=== UserData bootstrap complete at $(date) ==="
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-instance"
        - Key: Project
          Value: MERN-EduHub

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref Instance
  PublicIp:
    Description: Public IP of the EC2 instance
    Value: !GetAtt Instance.PublicIp
  KeyPairId:
    Description: Key pair ID — fetch private key from SSM Parameter Store
    Value: !GetAtt KeyPair.KeyPairId
  WebsiteURL:
    Description: Live URL of the MERN Application
    Value: !Sub "http://${Instance.PublicIp}"
