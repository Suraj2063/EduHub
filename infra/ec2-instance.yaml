AWSTemplateFormatVersion: "2010-09-09"
Description: MERN Stack EC2 Instance - AWS Academy compatible (Ubuntu 24.04, t3.medium)

Parameters:
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large]
    Description: EC2 instance size
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: AWS public SSM parameter - resolves to latest Amazon Linux 2023 AMI

Resources:

  # SSH Key Pair — auto-stored in SSM Parameter Store at /ec2/keypair/<KeyPairId>
  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub "${AWS::StackName}-keypair"
      KeyType: rsa

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} - SSH and HTTP"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP for MERN app

  # ── EC2 Instance ──────────────────────────────────────────────────────────────
  #   Vocareum lab_policy allows gp2 volumes ONLY (not gp3).
  #   Ubuntu 24.04 AMI defaults to gp3 root volume → must override to gp2.
  #   Device name: /dev/xvda (required for Nitro-based t3 instances).
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPair
      SecurityGroupIds:
        - !GetAtt SecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp2
            VolumeSize: 8
            DeleteOnTermination: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          exec > /var/log/userdata.log 2>&1
          echo "=== UserData bootstrap started at $(date) ==="
          dnf update -y
          dnf install -y docker git
          systemctl enable docker
          systemctl start docker
          usermod -aG docker ec2-user
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          echo "=== UserData bootstrap complete at $(date) ==="
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-instance"
        - Key: Project
          Value: MERN-EduHub

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref Instance
  PublicIp:
    Description: Public IP of the EC2 instance
    Value: !GetAtt Instance.PublicIp
  KeyPairId:
    Description: Key pair ID — fetch private key from SSM Parameter Store
    Value: !GetAtt KeyPair.KeyPairId
  WebsiteURL:
    Description: Live URL of the MERN Application
    Value: !Sub "http://${Instance.PublicIp}"
