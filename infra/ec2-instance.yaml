AWSTemplateFormatVersion: "2010-09-09"
Description: MERN Stack EC2 Instance (Ubuntu 24.04, t3.medium, 20GB gp3, Docker & Docker Compose)

Parameters:
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large]
    Description: EC2 instance size (Default t3.medium with 4GB RAM)
  VolumeSize:
    Type: Number
    Default: 20
    Description: Root disk volume size in GB (Default 20GB)
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Ubuntu 24.04 LTS AMI ID (passed in from GitHub Actions workflow)

Resources:

  # ── 1. SSH Key Pair ───────────────────────────────────────────────────────────
  #   AWS stores the private key in SSM Parameter Store at /ec2/keypair/<KeyPairId>
  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub "${AWS::StackName}-keypair"
      KeyType: rsa

  # ── 2. Security Group ─────────────────────────────────────────────────────────
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} - SSH (22) and HTTP (80)"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP access for MERN app

  # ── 3. EC2 Instance ───────────────────────────────────────────────────────────
  #   IMPORTANT: t3.medium uses Nitro hypervisor → root device MUST be /dev/xvda
  #   Using /dev/sda1 causes CREATE_FAILED on Nitro instances.
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPair
      SecurityGroupIds:
        - !GetAtt SecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSize
            DeleteOnTermination: true
            Encrypted: false
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > /var/log/userdata.log 2>&1
          echo "=== UserData bootstrap started at $(date) ==="
          apt-get update -y
          apt-get install -y ca-certificates curl gnupg git lsb-release
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
            | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
            | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -y
          apt-get install -y \
            docker-ce \
            docker-ce-cli \
            containerd.io \
            docker-buildx-plugin \
            docker-compose-plugin
          systemctl enable docker
          systemctl start docker
          usermod -aG docker ubuntu
          echo "=== UserData bootstrap complete at $(date) ==="
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-instance"
        - Key: Project
          Value: MERN-EduHub

Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref Instance
  PublicIp:
    Description: Public IP of the EC2 instance
    Value: !GetAtt Instance.PublicIp
  KeyPairId:
    Description: Key pair ID used to fetch private key from SSM Parameter Store
    Value: !GetAtt KeyPair.KeyPairId
  WebsiteURL:
    Description: URL of the MERN Application
    Value: !Sub "http://${Instance.PublicIp}"
